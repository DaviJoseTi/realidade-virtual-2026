<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR.js GPS Example</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 999;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>
    <div id="status">Obtendo localização...</div>

    <a-scene
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
        renderer="antialias: true; alpha: true">

        <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>

    </a-scene>

    <script>
        const statusDiv = document.getElementById("status");

        navigator.geolocation.getCurrentPosition(
            function(position) {

                const latitude = position.coords.latitude;
                const longitude = position.coords.longitude;

                // Aproximadamente 5 metros ao norte
                const objectLatitude = latitude + 0.00005;
                const objectLongitude = longitude;

                statusDiv.innerHTML =
                    `Latitude: ${latitude}<br>` +
                    `Longitude: ${longitude}`;

                const box = document.createElement("a-entity");

                box.setAttribute("geometry", "primitive: box");
                box.setAttribute("material", "color: red");
                box.setAttribute("scale", "5 5 5");

                box.setAttribute(
                    "gps-new-entity-place",
                    `latitude: ${objectLatitude}; longitude: ${objectLongitude}`
                );

                document.querySelector("a-scene").appendChild(box);

                console.log("Usuário:", latitude, longitude);
                console.log("Objeto:", objectLatitude, objectLongitude);

                statusDiv.innerHTML +=
                    "<br><br>Cubo criado aproximadamente 5m à frente.";
            },

            function(error) {
                console.error(error);

                statusDiv.innerHTML =
                    "Erro ao obter localização: " + error.message;
            },

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    </script>
</body>
</html>
